# Third-party Lovelace plugins to download on every HA instance startup.
#
# Each entry requires:
#   repo     - GitHub repository in "owner/name" format
#   asset    - name of the JS asset to download from the latest release
#   filename - filename to write inside www/ (usually the same as `asset`)
#
# Resolution order: release asset → repo root → dist/ folder.
#
# Plugins listed here are handled automatically by ha_testcontainer:
#   1. Downloaded into www/ at container startup.
#   2. Registered as Lovelace resources via lovelace_resources.yaml, which
#      HA loads at startup through ``resource_mode: yaml`` in
#      configuration.yaml.
#
# Note: expander-card.js is not listed here — it is copied from the local
# build (dist/expander-card.js) and registered separately via WebSocket by
# the _ha_lovelace_resources fixture in tests/conftest.py.

[]

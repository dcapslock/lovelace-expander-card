# Third-party Lovelace plugins to download on every HA instance startup.
#
# Each entry requires:
#   repo     - GitHub repository in "owner/name" format
#   asset    - name of the JS asset to download from the latest release
#   filename - filename to write inside www/ (usually the same as `asset`)
#
# Resolution order: release asset → repo root → dist/ folder.
#
# Plugins listed here are automatically:
#   1. Downloaded into tests/ha-config/www/ by ha_testcontainer at startup.
#   2. Registered as Lovelace resources (type: module) via the WebSocket API
#      by the _ha_lovelace_resources fixture in tests/conftest.py.
#
# Note: expander-card.js itself is not listed here — it is copied from the
# local build (dist/expander-card.js) and registered automatically.

[]
